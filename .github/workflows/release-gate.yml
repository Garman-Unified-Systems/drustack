name: Release Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4 — pinned SHA 2026-11-17
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install gitleaks with checksum verification
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          EXPECTED_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

          curl -sSfL "${GITLEAKS_URL}" -o "${GITLEAKS_ARCHIVE}"
          echo "${EXPECTED_SHA256}  ${GITLEAKS_ARCHIVE}" | sha256sum --check --strict
          tar -xz -C /usr/local/bin gitleaks -f "${GITLEAKS_ARCHIVE}"
          gitleaks version

      - name: Run release gate
        run: bash scripts/release-gate.sh .
