# Extended gitleaks rules for public release scanning.
# Supplements gitleaks default rules with families the defaults miss.
# Source: AGENTS.md — "a gitleaks-only scan is VOID" without these.

title = "release-gate extended rules"

[extend]
useDefault = true

# Allowlist: test fixtures contain intentional fake secrets/codenames;
# the scanner script contains the patterns as literal regex strings.
# All other paths in the repo remain fully covered.
[allowlist]
description = "Scanner's own test fixtures and pattern source"
paths = [
  '''tests/fixtures/should-fail/''',
  '''scripts/release-gate\.sh''',
  '''scripts/release-gate-rules\.toml''',
]

[[rules]]
id = "notion-token"
description = "Notion integration token"
regex = '''ntn_[0-9A-Za-z]{40,}'''
tags = ["secret", "notion"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-(?:proj-)?[0-9A-Za-z\-_]{40,}'''
tags = ["secret", "openai"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[0-9A-Za-z\-_]{80,}'''
tags = ["secret", "anthropic"]

[[rules]]
id = "huggingface-token"
description = "HuggingFace user access token"
regex = '''hf_[a-zA-Z0-9]{30,}'''
tags = ["secret", "huggingface"]

[[rules]]
id = "aws-access-key"
description = "AWS access key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["secret", "aws"]

[[rules]]
id = "aws-secret-key"
description = "AWS secret access key (common assignment forms)"
regex = '''(?i)aws[_\-]?secret[_\-]?(?:access[_\-]?)?key\s*[:=]\s*["']?[0-9A-Za-z/+]{40}["']?'''
tags = ["secret", "aws"]
